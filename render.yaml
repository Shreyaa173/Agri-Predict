services:
  - type: web
    name: fullstack-app
    env: python
    pythonVersion: 3.10
    buildCommand: |
      cd client && npm install && npm run build
      cd ..
      mkdir -p server/build
      cp -r client/build/* server/build/
      cd server
      pip install -r requirements.txt
    startCommand: |
      cd server
      gunicorn app:app
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
    region: oregon
